# Builds the Windows Setup.exe for tool 01 on every version tag (01-v1.0.0) or by hand, as a downloadable artifact.
# Releases carry the locally built and VM-tested Setup.exe (gh release create); this build is the reproducibility check.
name: build 01-chat-with-your-documents
on:
  push:
    tags: ["01-v*"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: 01-chat-with-your-documents } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: python installer/build.py "${REF#01-v}"
        shell: bash
        env: { REF: "${{ github.ref_type == 'tag' && github.ref_name || '01-v0.0.0' }}" }
      - uses: actions/upload-artifact@v4
        with: { name: setup, path: 01-chat-with-your-documents/dist/*-Setup-*.exe }
